syntax = "proto3";

package blocks.v1;

option go_package = "github.com/Ajay01103/go-dropbox/pkg/gen/blocks;blocks";

import "google/protobuf/timestamp.proto";

// Metadata publishes this request after creating a durable purge job.
// Subject: blocks.refs.decrement.requested
message BlockRefDecrementRequested {
  uint32 schema_version = 1;

  // Matches purge_jobs.job_id and is unique for one purge attempt.
  string job_id = 2;

  // Each item represents one reference to remove. The occurrence index makes
  // repeated hashes in an ordered block list independently idempotent.
  repeated BlockDecrementOperation operations = 3;

  string reason = 4;
  google.protobuf.Timestamp requested_at = 5;
}

message BlockDecrementOperation {
  uint32 occurrence = 1;
  string block_hash = 2;
}

// Upload publishes this completion after all requested block operations have
// reached a terminal per-block state.
// Subject: blocks.refs.decrement.completed
message BlockRefDecrementCompleted {
  uint32 schema_version = 1;
  string job_id = 2;
  repeated BlockDecrementResult results = 3;
  google.protobuf.Timestamp processed_at = 4;
  bool was_replay = 5;
}

message BlockDecrementResult {
  uint32 occurrence = 1;
  string block_hash = 2;
  int64 new_ref_count = 3;
  bool became_gc_candidate = 4;

  // Non-empty means the operation could not be applied. The job remains
  // auditable and must be surfaced to reconciliation and alerting.
  string error = 5;
}
