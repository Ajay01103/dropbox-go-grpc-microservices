syntax = "proto3";

package metadata;

option go_package = "github.com/Ajay01103/go-dropbox/metadata/gen/pb;pb";

// ─── Request / Response Messages ─────────────────────────────────────────────

message CreateFileRequest {
  string folder_id = 1;
  string filename = 2;
  int64 size_bytes = 3;
  string content_type = 4;
  string content_hash = 5; // SHA256 of full file
  string storage_key = 6; // reference to storage object
  repeated string block_hash_list = 8; // ordered content-addressed blocks
}

message CreateFileResponse {
  string file_id = 1;
  string folder_id = 2;
  string filename = 3;
  int64 size_bytes = 4;
  string content_hash = 5;
  string created_at = 6;
  string storage_key = 7;
  repeated string block_hash_list = 8;
}

message SetThumbnailRequest {
  string file_id = 1;
  string thumbnail_key = 2;
  string thumbnail_status = 3; // pending | ready | failed
}

message SetThumbnailResponse {
  bool success = 1;
}

message GetThumbnailStatusRequest {
  string file_id = 1;
}

message GetThumbnailStatusResponse {
  string thumbnail_key = 1;
  string thumbnail_status = 2;
}

message GetFileRequest {
  string file_id = 1;
}

message File {
  string file_id = 1;
  string folder_id = 2;
  string filename = 3;
  int64 size_bytes = 4;
  string content_type = 5;
  string content_hash = 6;
  int32 version = 7;
  string created_at = 8;
  string owner_id = 9;
  string parent_folder_id = 10;
  string thumbnail_key = 11;
  string thumbnail_status = 12;
  string storage_key = 13;
  repeated string block_hash_list = 14;
}

message ListFolderRequest {
  string folder_id = 1;
  string page_token = 2; // for pagination
  int32 page_size = 3; // default 100
}

message ListFolderResponse {
  repeated File files = 1;
  string next_page_token = 2;
}

message DeleteFileRequest {
  string file_id = 1;
}

message DeleteFileResponse {
  bool success = 1;
}

// ─── Service Definition ──────────────────────────────────────────────────────

service MetadataService {
  rpc CreateFile(CreateFileRequest) returns (CreateFileResponse);
  rpc SetThumbnail(SetThumbnailRequest) returns (SetThumbnailResponse);
  rpc GetThumbnailStatus(GetThumbnailStatusRequest) returns (GetThumbnailStatusResponse);
  rpc GetFile(GetFileRequest) returns (File);
  rpc ListFolder(ListFolderRequest) returns (ListFolderResponse);
  rpc DeleteFile(DeleteFileRequest) returns (DeleteFileResponse);
}
