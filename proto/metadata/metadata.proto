syntax = "proto3";

package metadata;


option go_package = "github.com/Ajay01103/go-dropbox/metadata/gen/pb;pb";

// ─── Request / Response Messages ─────────────────────────────────────────────

message CreateFileRequest {
  string folder_id = 1;
  string filename = 2;
  int64 size_bytes = 3;
  string content_type = 4;
  string content_hash = 5; // SHA256 of full file
  reserved 6;
  repeated string block_hash_list = 8; // ordered content-addressed blocks
  // Content family classified at upload time from magic bytes (trust
  // boundary). Matches events.v2.ContentFamily values: 0=unspecified,
  // 1=image, 2=video, 3=pdf, 4=other. Only image/video/pdf ever get a
  // preview job (thumbnail_status='pending'); everything else starts ''.
  uint32 content_family = 9;
  // Dense download manifest (hash + size per block), written to the
  // file_manifest table at CreateFile time so byte-range reconstruction
  // needs ONE row read instead of N GetBlock size lookups.
  repeated BlockRef block_refs = 10;
}

// BlockRef is one content-addressed block in a file's download manifest.
message BlockRef {
  string hash = 1;
  int64 size_bytes = 2;
}

// FileManifest is the ordered, fully-sized block manifest of a single file
// version. Content-addressed and immutable per version. Served (with an
// ownership check) via FileService.GetFileManifest; the plain-HTTP content
// server trusts a scoped download ticket instead of re-checking ACLs.
message FileManifest {
  string file_id = 1;
  string filename = 2;
  int64 total_size = 3;
  string content_type = 4;
  string content_hash = 5;
  repeated BlockRef blocks = 6;
}

message CreateFileResponse {
  string file_id = 1;
  string folder_id = 2;
  string filename = 3;
  int64 size_bytes = 4;
  string content_hash = 5;
  string created_at = 6;
  reserved 7;
  repeated string block_hash_list = 8;
}

message SetThumbnailRequest {
  string file_id = 1;
  string thumbnail_key = 2;
  string thumbnail_status = 3; // pending | ready | failed
}

message SetThumbnailResponse {
  bool success = 1;
}

message GetThumbnailStatusRequest {
  string file_id = 1;
}

message GetThumbnailStatusResponse {
  string thumbnail_key = 1;
  string thumbnail_status = 2;
}

message GetThumbnailURLRequest {
  string file_id = 1;
}

message GetThumbnailURLResponse {
  string url = 1;
  string thumbnail_status = 2;
}

message GetThumbnailURLsRequest {
  repeated string file_ids = 1;
}

// ThumbnailURL is one item of a batch lookup. Each requested file gets exactly
// one entry (same order as the request), so a grid can map results back
// without a second index.
message ThumbnailURL {
  string file_id = 1;
  // Empty when the file has no ready thumbnail (see thumbnail_status) or when
  // this file could not be resolved at all (see error).
  string url = 2;
  string thumbnail_status = 3;
  // Set when the file could not be resolved: unknown id, or a file the caller
  // does not own. One bad id never fails the whole batch.
  string error = 4;
}

message GetThumbnailURLsResponse {
  repeated ThumbnailURL thumbnails = 1;
}

message GetFileRequest {
  string file_id = 1;
}

message GetFileManifestRequest {
  string file_id = 1;
}

message GetDownloadTicketRequest {
  string file_id = 1;
  // "inline" for browser preview surfaces (<video>, <img>, <iframe>),
  // "attachment" (default) when the browser should download.
  string disposition = 2;
}

message GetDownloadTicketResponse {
  string ticket = 1;
  // Full content-server URL with the ticket query param already appended.
  string url = 2;
  int64 expires_in_seconds = 3;
  string filename = 4;
  string content_type = 5;
  int64 size_bytes = 6;
}

// ─── In-browser editing (PDF / DOCX / XLSX) ──────────────────────────────────

// BlockRef/FileManifest above describe a file version's bytes. Editing adds a
// version history: (file_id, version) rows are immutable, only the head moves.

message GetEditSessionRequest {
  string file_id = 1;
}

// GetEditSession is the editor's entry point: it authorizes the caller, decides
// whether the type is editable at all, and hands back a version-pinned ticket
// URL so the bytes the user edits are exactly the version the commit will be
// based on. The upload service calls it too, to learn the head block list when
// a save only needs to send the blocks that changed.
message GetEditSessionResponse {
  bool can_edit = 1;
  // Why editing is unavailable: type_not_editable | too_large | disabled.
  // Empty when can_edit is true.
  string unavailable_reason = 2;
  int32 version = 3;
  string content_hash = 4;
  // Version-pinned inline content URL (ticket already appended).
  string ticket_url = 5;
  int64 expires_in_seconds = 6;
  // The block size the file was written with. A save must split at exactly
  // this size, so the unchanged blocks keep their hash and are not re-sent.
  int64 block_size = 7;
  int64 max_edit_bytes = 8;
  // pdf | docx | xlsx (sniffed from the bytes, never the client's MIME).
  string sniffed_type = 9;
  string filename = 10;
  int64 size_bytes = 11;
  string content_type = 12;
  // Head block hashes, in order — the list a save compares itself against.
  repeated string block_hashes = 13;
}

message PrepareCommitRequest {
  string file_id = 1;
  int32 base_version = 2;
  int64 size_bytes = 3;
  int64 block_size = 4;
  repeated string block_hashes = 5;
}

// PrepareCommit is an advisory pre-flight: it reports which of the caller's
// hashes this file already references (so a save can skip sending unchanged
// blocks) and whether the base version is still the head. It never reports on
// blocks the caller does not already reference — that would be a cross-user
// dedup oracle. Commit is the authority, not this call.
message PrepareCommitResponse {
  repeated string already_referenced_hashes = 1;
  int32 head_version = 2;
  bool base_is_head = 3;
}

message CommitVersionRequest {
  string file_id = 1;
  // The version the edit was based on. The commit wins (file_id, base+1) with
  // INSERT ... IF NOT EXISTS; a loser gets conflict=true and the head it lost
  // to, never an overwrite.
  int32 base_version = 2;
  string commit_id = 3;
  int64 size_bytes = 4;
  int64 block_size = 5;
  repeated string block_hashes = 6;
  // Per-block sizes, positionally paired with block_hashes.
  repeated int64 block_sizes = 7;
  // Which editor produced these bytes, e.g. extend-pdf-editor.
  string editor = 8;
  string content_type = 9;
  string filename = 10;
}

message CommitVersionResponse {
  bool committed = 1;
  bool conflict = 2;
  // Set when committed: the new version and its content hash.
  int32 version = 3;
  string content_hash = 4;
  // Set when conflict: where the file actually is.
  int32 head_version = 5;
  string head_content_hash = 6;
  // True when these exact bytes were already committed (a retry of a save
  // whose response was lost). Committed is true and the version is the one
  // that already holds them — the caller must not count the version's blocks
  // as newly referenced, or a retry would inflate every ref count.
  bool duplicate = 7;
}

message File {
  string file_id = 1;
  string folder_id = 2;
  string filename = 3;
  int64 size_bytes = 4;
  string content_type = 5;
  string content_hash = 6;
  int32 version = 7;
  string created_at = 8;
  string owner_id = 9;
  string parent_folder_id = 10;
  string thumbnail_key = 11;
  string thumbnail_status = 12;
  bool is_deleted = 13;
  string deleted_at = 14;
  bool current = 15;
}

message Folder {
  string folder_id = 1;
  string owner_id = 2;
  string parent_id = 3;
  string name = 4;
  string path = 5;
  string created_at = 6;
  string updated_at = 7;
  bool is_deleted = 8;
  string deleted_at = 9;
}

message CreateFolderRequest {
  string parent_id = 1;
  string name = 2;
}

message GetFolderRequest {
  string folder_id = 1;
}

message ListFolderContentsRequest {
  string folder_id = 1;
  string page_token = 2;
  int32 page_size = 3;
}

message ListFolderContentsResponse {
  repeated Folder folders = 1;
  repeated File files = 2;
  string next_page_token = 3;
}

message RenameFolderRequest {
  string folder_id = 1;
  string new_name = 2;
}

message MoveFolderRequest {
  string folder_id = 1;
  string new_parent_id = 2;
}

message DeleteFolderRequest {
  string folder_id = 1;
}

message DeleteFolderResponse {
  bool success = 1;
}

message RestoreFolderRequest {
  string folder_id = 1;
}

message GetBreadcrumbsRequest {
  string folder_id = 1;
}

message GetBreadcrumbsResponse {
  repeated Folder folders = 1;
}

message GetOrCreateRootFolderRequest {
  // empty — owner is derived from the authenticated session
}

message GetOrCreateRootFolderResponse {
  Folder folder = 1;
}

enum FileSort {
  FILE_SORT_UPDATED_AT = 0;
  FILE_SORT_NAME = 1;
  FILE_SORT_SIZE = 2;
}

message ListFilesRequest {
  string folder_id = 1;
  string page_token = 2;
  int32 page_size = 3;
  FileSort sort = 4;
}

message ListFilesResponse {
  repeated File files = 1;
  string next_page_token = 2;
}

message Item {
  string item_type = 1; // file | folder
  string item_id = 2;
  string folder_id = 3;
  oneof details {
    File file = 4;
    Folder folder = 5;
  }
}

message ListFolderItemsRequest {
  string folder_id = 1;
  string page_token = 2;
  int32 page_size = 3;
  FileSort sort = 4;
}

message ListFolderItemsResponse {
  repeated Item items = 1;
  string next_page_token = 2;
}

message ListRecentItemsRequest {
  string page_token = 1;
  int32 page_size = 2;
}

message ListRecentItemsResponse {
  repeated Item items = 1;
  string next_page_token = 2;
}

message RecordFileAccessRequest {
  string file_id = 1;
}

message RecordFileAccessResponse {
  bool success = 1;
}

message RenameFileRequest {
  string file_id = 1;
  string new_name = 2;
}

message MoveFileRequest {
  string file_id = 1;
  string new_folder_id = 2;
}

message RestoreFileRequest {
  string file_id = 1;
}

message PermanentlyDeleteFileRequest {
  string file_id = 1;
}

message PermanentlyDeleteFolderRequest {
  string folder_id = 1;
}

// PermanentlyDeleteFolder is a subtree operation: the folder, every descendant
// folder, and every file they contain are queued for permanent deletion and
// then dropped from metadata. The counts are reported because this is a
// fan-out, not one file — a caller must be able to tell a partial purge from a
// clean one instead of assuming success.
message PermanentlyDeleteFolderResponse {
  // Folders dropped from metadata: the target plus each descendant.
  int32 folder_count = 1;
  // Files inside the subtree that were queued for permanent deletion.
  int32 file_count = 2;
  // Files that could not be queued. Non-zero means some content may survive.
  int32 failed_count = 3;
}

message PurgeJob {
  string job_id = 1;
  string file_id = 2;
  int32 file_version = 3;
  string state = 4;
  // B4 semantic change: previously true also for benign "block missing"
  // decrements. Now true only when the job has INVALID decrement ops.
  bool has_reconciliation_errors = 5;
  int32 attempts = 6;
  string last_error = 7;
  string created_at = 8;
  string updated_at = 9;
  string completed_at = 10;
  // B4: additive exposure of the v2 invalid occurrence indices.
  repeated int32 invalid_ops = 11;
}

message GetPurgeJobStatusRequest {
  string job_id = 1;
}

message ListTrashRequest {
  string page_token = 1;
  int32 page_size = 2;
}

message ListTrashResponse {
  repeated File files = 1;
  repeated Folder folders = 2;
  string next_page_token = 3;
}

message ListFolderRequest {
  string folder_id = 1;
  string page_token = 2; // for pagination
  int32 page_size = 3; // default 100
}

message ListFolderResponse {
  repeated File files = 1;
  string next_page_token = 2;
}

message DeleteFileRequest {
  string file_id = 1;
}

message DeleteFileResponse {
  bool success = 1;
}

// ─── Service Definition ──────────────────────────────────────────────────────

service MetadataService {
  rpc CreateFile(CreateFileRequest) returns (CreateFileResponse);
  rpc SetThumbnail(SetThumbnailRequest) returns (SetThumbnailResponse);
  rpc GetThumbnailStatus(GetThumbnailStatusRequest) returns (GetThumbnailStatusResponse);
  rpc GetThumbnailURL(GetThumbnailURLRequest) returns (GetThumbnailURLResponse);
  // Batch form of GetThumbnailURL: one round trip for a whole grid of cards.
  rpc GetThumbnailURLs(GetThumbnailURLsRequest) returns (GetThumbnailURLsResponse);
  // Mints a single-file, short-lived download ticket after an ownership
  // check. The plain-HTTP content server verifies this ticket statelessly;
  // it never re-checks ACLs.
  rpc GetDownloadTicket(GetDownloadTicketRequest) returns (GetDownloadTicketResponse);
  rpc GetFile(GetFileRequest) returns (File);
  rpc ListFolder(ListFolderRequest) returns (ListFolderResponse);
  rpc DeleteFile(DeleteFileRequest) returns (DeleteFileResponse);
  // ─── In-browser editing ───────────────────────────────────────────────────
  // Authorizes an edit and returns a version-pinned ticket + the parameters a
  // save must use (block size, caps, sniffed type).
  rpc GetEditSession(GetEditSessionRequest) returns (GetEditSessionResponse);
  // Advisory pre-flight for a save: which blocks this file already has.
  rpc PrepareCommit(PrepareCommitRequest) returns (PrepareCommitResponse);
  // Commits edited bytes as the next immutable version. Called by the upload
  // service on finalize (it owns block writes and ref-counting), never by the
  // browser directly.
  rpc CommitVersion(CommitVersionRequest) returns (CommitVersionResponse);
}

service FileService {
  rpc CreateFile(CreateFileRequest) returns (CreateFileResponse);
  rpc GetFile(GetFileRequest) returns (File);
  // Returns the ordered dense block manifest of the file. The only place an
  // ownership/ACL check happens for content access; downstream content
  // serving trusts a ticket, not a re-check.
  rpc GetFileManifest(GetFileManifestRequest) returns (FileManifest);
  rpc ListFiles(ListFilesRequest) returns (ListFilesResponse);
  rpc RenameFile(RenameFileRequest) returns (File);
  rpc MoveFile(MoveFileRequest) returns (File);
  rpc DeleteFile(DeleteFileRequest) returns (DeleteFileResponse);
  rpc RestoreFile(RestoreFileRequest) returns (File);
  rpc PermanentlyDeleteFile(PermanentlyDeleteFileRequest) returns (PurgeJob);
  rpc GetPurgeJobStatus(GetPurgeJobStatusRequest) returns (PurgeJob);
  rpc ListTrash(ListTrashRequest) returns (ListTrashResponse);
  rpc ListRecentItems(ListRecentItemsRequest) returns (ListRecentItemsResponse);
  rpc RecordFileAccess(RecordFileAccessRequest) returns (RecordFileAccessResponse);
}

service FolderService {
  rpc CreateFolder(CreateFolderRequest) returns (Folder);
  rpc GetFolder(GetFolderRequest) returns (Folder);
  rpc ListFolderContents(ListFolderContentsRequest) returns (ListFolderContentsResponse);
  rpc ListFolderItems(ListFolderItemsRequest) returns (ListFolderItemsResponse);
  rpc RenameFolder(RenameFolderRequest) returns (Folder);
  rpc MoveFolder(MoveFolderRequest) returns (Folder);
  rpc DeleteFolder(DeleteFolderRequest) returns (DeleteFolderResponse);
  rpc RestoreFolder(RestoreFolderRequest) returns (Folder);
  // Permanent deletion of a trashed folder, its descendant folders, and every
  // file they contain. Requires the folder to be soft-deleted already, so this
  // can never become a hard-delete back door for live data.
  rpc PermanentlyDeleteFolder(PermanentlyDeleteFolderRequest) returns (PermanentlyDeleteFolderResponse);
  rpc GetBreadcrumbs(GetBreadcrumbsRequest) returns (GetBreadcrumbsResponse);
  rpc GetOrCreateRootFolder(GetOrCreateRootFolderRequest) returns (GetOrCreateRootFolderResponse);
}
