syntax = "proto3";

package upload;

option go_package = "github.com/Ajay01103/go-dropbox/upload/gen/pb;pb";

// ─── Request / Response Messages ─────────────────────────────────────────────

message InitUploadRequest {
  string filename = 1;
  int64 total_size_bytes = 2;
  string content_type = 3;
  string sha256_of_full_file = 4; // optional, enables pre-upload dedup check
}

message InitUploadResponse {
  string upload_id = 1;
  int64 chunk_size_bytes = 2;
  repeated int64 already_received_offsets = 3; // empty for a fresh upload
  bool already_complete = 4; // true if file already exists (dedup hit)
  string object_id = 5; // if dedup hit, reference to existing object
  repeated int32 already_received_chunk_indices = 6;
}

message UploadChunkRequest {
  string upload_id = 1;
  int64 offset = 2;
  bytes data = 3;
  string sha256_of_chunk = 4;
  int32 chunk_index = 5;
}

message UploadChunkAck {
  string upload_id = 1;
  int64 offset_persisted = 2;
  bool is_final = 3;
  bool deduplicated = 4;
}

message GetUploadStatusRequest {
  string upload_id = 1;
}

message GetUploadStatusResponse {
  string upload_id = 1;
  int64 last_persisted_offset = 2;
  int64 total_size_bytes = 3;
  string status = 4; // pending | in_progress | completed | aborted
  repeated int32 received_chunk_indices = 5;
}

// ─── In-browser editing (PDF / DOCX / XLSX) ──────────────────────────────────
//
// A save reuses only the blocks the file already holds and writes the rest.
// Block writes and ref-counting stay here (the upload service owns both); the
// metadata service owns the version row and the head pointer.

message WriteEditBlockRequest {
  string file_id = 1;
  // The block's position in the new version's ordered list. Not trusted as
  // identity (the hash is), but it is what the logs and the ack refer to.
  int32 index = 2;
  string sha256 = 3;
  bytes data = 4;
}

// WriteEditBlockResponse reports what happened to one block: written means this
// call stored the bytes (staged until a commit references them); reused means
// the block was already there and nothing was written.
message WriteEditBlockResponse {
  bool written = 1;
  bool reused = 2;
  int64 size_bytes = 3;
}

message CommitEditRequest {
  string file_id = 1;
  int32 base_version = 2;
  // Client-generated, stored on the version row for audit and double-submit
  // dedup. A retry of the same save keeps the same id.
  string commit_id = 3;
  int64 size_bytes = 4;
  int64 block_size = 5;
  // The complete new version, in order: every hash, not only the new ones.
  repeated string block_hashes = 6;
  // Positionally paired with block_hashes; the server derives them and treats
  // a mismatch as a client error.
  repeated int64 block_sizes = 7;
  string editor = 8;
  string filename = 9;
  string content_type = 10;
}

message CommitEditResponse {
  bool committed = 1;
  bool conflict = 2;
  int32 version = 3;
  string content_hash = 4;
  int32 head_version = 5;
  string head_content_hash = 6;
  // How many of the version's blocks the file already held — the saving a
  // client can see and an operator can trend.
  int64 blocks_reused = 7;
}

// ─── Service Definition ──────────────────────────────────────────────────────

service UploadService {
  rpc InitUpload(InitUploadRequest) returns (InitUploadResponse);
  rpc UploadChunk(UploadChunkRequest) returns (UploadChunkAck);
  rpc UploadChunks(stream UploadChunkRequest) returns (stream UploadChunkAck);
  rpc GetUploadStatus(GetUploadStatusRequest) returns (GetUploadStatusResponse);
  // Editing: write one missing block, then commit the version. Two unary
  // calls rather than one stream so a save can send its blocks from several
  // parallel workers and stay inside the per-message size cap.
  rpc WriteEditBlock(WriteEditBlockRequest) returns (WriteEditBlockResponse);
  rpc CommitEdit(CommitEditRequest) returns (CommitEditResponse);
}
