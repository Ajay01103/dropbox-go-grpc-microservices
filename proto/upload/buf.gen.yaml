version: v2
clean: true
inputs:
  - directory: .
plugins:
  - remote: buf.build/protocolbuffers/go
    out: ../../services/upload/gen/pb
    opt: paths=source_relative
  - remote: buf.build/connectrpc/go
    out: ../../services/upload/gen/pb
    opt: paths=source_relative
  - remote: buf.build/bufbuild/es:v2.12.0
    out: ../../web/src/gen/pb/upload
    opt:
      - target=ts
      - import_extension=none
