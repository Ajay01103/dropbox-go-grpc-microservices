version: v2
clean: true
inputs:
  - directory: .
plugins:
  - remote: buf.build/protocolbuffers/go
    out: ../../services/upload/gen/pb
    opt: paths=source_relative
  - remote: buf.build/connectrpc/go:v2.0.0
    out: ../../services/upload/gen/pb
    opt: paths=source_relative
  - remote: buf.build/bufbuild/es
    out: ../../web/src/gen/pb/upload
    opt:
      - target=ts
      - import_extension=none
  # Native (Expo) client: same generated TS, its own out dir so the mobile app
  # never reaches into the web app's source tree.
  - remote: buf.build/bufbuild/es
    out: ../../native/src/gen/pb/upload
    opt:
      - target=ts
      - import_extension=none
